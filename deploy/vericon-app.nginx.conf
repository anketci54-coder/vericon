server {
    listen 80;
    listen [::]:80;
    server_name app.vericon.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vericon-acme;
        try_files $uri =404;
    }

    location / { return 301 https://app.vericon.site$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.vericon.site;
    ssl_certificate /etc/letsencrypt/live/app.vericon.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vericon.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://ftzxcvrrgvlhlxufxccz.supabase.co; img-src 'self' data:; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
    }

    location = /auth/me {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control no-store always;
    }

    location = /shopify/ownership/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /shopify/ownership/verify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /tenant/shopify/ownership/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /tenant/shopify/ownership/verify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /tenant/finance/invoice-count {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /tenant/finance/access-check {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /tenant/quickbooks/disconnect {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /tenant/quickbooks/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }
    location = /oauth/quickbooks/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        add_header Cache-Control "no-store" always;
    }

    location = /oauth/quickbooks/callback {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
        add_header Cache-Control "no-store" always;
    }

    location = / {
        root /var/www/vericon-app;
        try_files /index.html =404;
    }

    location = /style.css {
        root /var/www/vericon-app;
    }

    location = /tenant-isolation-check.js {
        root /var/www/vericon-app;
    }

    location = /app.bundle.js {
        root /var/www/vericon-app;
    }

    location / { return 404; }
}
