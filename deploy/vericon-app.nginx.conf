# Included from the Nginx http context. Empty keys leave assets/health unlimited.
map $uri $vericon_api_limit_key {
    default "";
    ~^/(auth|oauth|tenant|shopify)/ $binary_remote_addr;
}
limit_req_zone $vericon_api_limit_key zone=vericon_api_per_ip:10m rate=5r/s;
# OAuth callback metadata only: never log URI, query, code or state.
log_format vericon_oauth_callback_status 'status=$status upstream=$upstream_status elapsed=$request_time';
map $limit_req_status $vericon_retry_after {
    default "";
    REJECTED "1";
}

server {
    listen 80;
    listen [::]:80;
    server_name app.vericon.site;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/vericon-acme;
        try_files $uri =404;
    }

    # Protect callback credentials even on the HTTP -> HTTPS redirect.
    location = /oauth/quickbooks/callback {
        access_log /var/log/nginx/vericon-oauth-callback-status.log vericon_oauth_callback_status;
        error_log /dev/null;
        return 301 https://app.vericon.site$request_uri;
    }

    location / { return 301 https://app.vericon.site$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.vericon.site;
    ssl_certificate /etc/letsencrypt/live/app.vericon.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.vericon.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    limit_req zone=vericon_api_per_ip burst=10 nodelay;
    limit_req_status 429;
    add_header Retry-After $vericon_retry_after always;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self' https://ftzxcvrrgvlhlxufxccz.supabase.co; img-src 'self' data:; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /health {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization "";
    }

    location = /auth/me {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Authorization $http_authorization;
    }

    location = /shopify/ownership/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /shopify/ownership/verify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /tenant/shopify/ownership/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /tenant/shopify/ownership/verify {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8788;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /tenant/finance/invoice-count {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /tenant/finance/access-check {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /tenant/quickbooks/disconnect {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8789;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /tenant/quickbooks/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
    }
    location = /oauth/quickbooks/start {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
    }

    location = /oauth/quickbooks/callback {
        access_log /var/log/nginx/vericon-oauth-callback-status.log vericon_oauth_callback_status;
        # Nginx upstream errors include the full request URI (OAuth code/state).
        # Application warnings retain only sanitized error categories.
        error_log /dev/null;
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization "";
    }

    location = / {
        root /var/www/vericon-app;
        try_files /index.html =404;
    }

    location = /style.css {
        root /var/www/vericon-app;
    }

    location = /tenant-isolation-check.js {
        root /var/www/vericon-app;
    }

    location = /app.bundle.js {
        root /var/www/vericon-app;
    }

    location / { return 404; }
}
